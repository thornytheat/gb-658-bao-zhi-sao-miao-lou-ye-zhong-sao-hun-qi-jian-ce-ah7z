{% extends "base.html" %}
{% block content %}
<section class="kpis">
  <div class="kpi"><b>登记批次</b><strong id="kpi-batches">0</strong><small>批</small></div>
  <div class="kpi"><b>合作站点</b><strong id="kpi-stations">0</strong><small>站</small></div>
  <div class="kpi"><b>查阅账目</b><strong id="kpi-access">0</strong><small>次</small></div>
  <div class="kpi"><b>规则版</b><strong>1.7</strong><small>v</small></div>
</section>
<div class="grid grid--receipt">
  <section class="panel">
    <div class="panel__head"><h2>交付范围</h2><span class="state state--ok">口径可回读</span></div>
    <div class="panel__body panel__body--scroll">
      <table class="ledger" id="scope-table">
        <thead><tr><th>站点</th><th>状态</th><th>批次</th><th class="num">行数</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <section class="panel panel--evidence">
    <div class="panel__head"><h2>查阅记录</h2><span class="panel__meta" id="access-count">0 条</span></div>
    <div class="panel__body panel__body--scroll">
      <table class="ledger" id="access-table">
        <thead><tr><th>请求号</th><th>角色</th><th>用途</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <section class="panel panel--status">
    <div class="panel__head"><h2>交付边界</h2><span class="panel__meta">只读回读</span></div>
    <div class="panel__body"><div class="evidence"><b>按站点裁剪</b><span>原始整批与逐行材料完整保留</span><code>GET /api/evidence/stations</code><code>GET /api/evidence/access</code></div></div>
  </section>
</div>
<script>
async function load(){
  const [stations, access] = await Promise.all([
    fetch("/api/evidence/stations").then(r => r.json()),
    fetch("/api/evidence/access").then(r => r.json()),
  ]);
  const stationRows = stations.stations || [];
  const scope = document.querySelector("#scope-table tbody");
  scope.innerHTML = stationRows.flatMap(item => {
    const batches = Object.entries(item.batches || {});
    if(!batches.length) return [`<tr><td>${item.station_id}</td><td>${item.status}</td><td>—</td><td class="num">0</td></tr>`];
    return batches.map(([batch, info]) => `<tr><td>${item.station_id}</td><td>${item.status}</td><td>${batch}</td><td class="num">${info.rows}</td></tr>`);
  }).join("") || `<tr><td colspan="4">尚无站点</td></tr>`;
  const records = access.records || [];
  const log = document.querySelector("#access-table tbody");
  log.innerHTML = records.map(item => `<tr><td>${item.request_id}</td><td>${item.actor_id}</td><td>${item.purpose || "—"}</td><td>${item.status}</td></tr>`).join("") || `<tr><td colspan="4">尚无查阅</td></tr>`;
  document.querySelector("#kpi-stations").textContent = stationRows.length;
  document.querySelector("#kpi-access").textContent = records.length;
  document.querySelector("#access-count").textContent = `${records.length} 条`;
}
load();
</script>
{% endblock %}
